# ============================================================================
# 让电源键不再"关机"，而是作为普通输入事件（用来唤醒屏幕）
#
# 本项目用 marble-screen-idle.sh 直接读 /dev/input/event*，
# 按下电源键会产生 EV_KEY 事件 → 屏幕亮起。
#
# 但如果 logind 还保留默认的 HandlePowerKey=poweroff，短按电源键会直接关机，
# 服务器上这是灾难。所以这里改成 ignore。
#
# 放好后执行： systemctl restart systemd-logind
# （注意：restart logind 会重启当前会话，SSH 连接可能断开，重连即可）
# ============================================================================
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore

# 如果你希望"长按电源键仍然强制关机"，把下面这行注释掉、上面那行删掉即可：
# HandlePowerKeyLongPress=poweroff

# 说明：硬件级长按（PMIC 直接切断）不受此配置影响，仍然可以强制断电。

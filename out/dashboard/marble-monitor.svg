<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a33"/>
      <stop offset="100%" stop-color="#101714"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#33d17a"/>
      <stop offset="100%" stop-color="#8ff0a4"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- 手机外框 -->
  <rect x="40" y="20" width="48" height="88" rx="9"
        fill="none" stroke="#8ff0a4" stroke-width="4"/>
  <!-- 听筒 -->
  <rect x="56" y="26" width="16" height="3" rx="1.5" fill="#8ff0a4" opacity="0.6"/>

  <!-- 屏内柱状图 -->
  <rect x="50" y="66"  width="6" height="16" rx="2" fill="url(#bar)"/>
  <rect x="60" y="56"  width="6" height="26" rx="2" fill="url(#bar)"/>
  <rect x="70" y="62"  width="6" height="20" rx="2" fill="url(#bar)"/>
  <rect x="50" y="86"  width="26" height="3" rx="1.5" fill="#8ff0a4" opacity="0.45"/>

  <!-- 右上角温度点 -->
  <circle cx="94" cy="34" r="7" fill="#f6d32d"/>
</svg>
